  description:
    value: >-
      <p>You bend the mind of a creature so that it becomes less resistant to
      powers and spells that warp their loyalty. The target must roll twice to
      save against any charm or compulsion spells, powers or effects, and take
      the worst save.

      </p>

      <p><strong>Augment: </strong>This power may be augmented in one or more of
      the following ways.

      </p><ol><li>If you spend 2 additional power points, the duration of any
      failed charm or compulsion effect is doubled.</li><li>If you spend 2
      additional power points, you can affect another creature in
      range.</li></ol>
