  description:
    instructions: ''
    value: |-
      <p>You can use another's psionic or metapsionic feats for yourself. You make a melee touch attack against a target. If successful, you immediately are familiar with the target's psionic and metapsionic feats, if any, and you can choose two of these feats to "leech".
      </p>
      <p>While the power lasts, you are treated as if you possessed the stolen feats, despite the fact that you have more feats than normally allowed. During this same period, the target can make no use of the stolen feats. When the power's duration expires, you lose access to the feats, and the target gains immediate use of them. This transfer occurs regardless of the distance between you and the target.
      </p>
      <p>If the duration of feat leech is extended by the use of a metapsionic feat, the target gains a Will saving throw every 10 minutes beyond the normal duration. If this save succeeds, the power's duration ends. If the target is killed before the duration expires, you immediately lose the benefit of the stolen feats.
      </p>
      <p>You cannot steal a feat for which you do not meet the prerequisites, if any. However, you can use a stolen feat as the prerequisite for another stolen feat.
      </p>
      <p><strong>Augment:</strong> For every 2 additional power points you spend, you can leech another feat and this power's save DC increases by 1.
      </p>
